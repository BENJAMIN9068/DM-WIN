<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1424" />
  <meta name="color-scheme" content="dark" />
  <title>DM WIN Predictor</title>
  <link rel="manifest" href="/black-og-hack/manifest.webmanifest" />
  <script src="/black-og-hack/sw-register.js"></script>
  <style>
    :root {
      --bg: #0f1424;
      --panel: #171e32;
      --panel2: #1b243a;
      --border: #27304f;
      --text: #e6e9f2;
      --muted: #9aa3c0;
      --accent: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
      --violet: #a855f7;
      --yellow: #eab308;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html,body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
    body { padding-bottom: env(safe-area-inset-bottom); }
    a { color: inherit; text-decoration: none; }
    button,input,select { font: inherit; outline: none; }
    .container { max-width: 1040px; margin: 0 auto; padding: 16px; }
    header { padding: 18px 0 10px; text-align: center; }
    header h1 { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
    header .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .row-between { display: flex; align-items: center; gap: 10px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 6px; }
    .tab { background: var(--panel); border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; transition: .18s; }
    .tab:hover { background: var(--panel2); color: var(--text); }
    .tab.active { background: var(--accent); color: #fff; }
    .intervals { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
    .interval { height: 30px; padding: 5px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--muted); }
    .interval.active { border-color: var(--accent); color: var(--text); background: rgba(59,130,255,.15); }
    .interval.all { border-style: dashed; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250, 1fr)); gap: 12px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; position: relative; overflow: hidden; }
    .card.locked::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--red); }
    .card.running::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--orange); }
    .card.final::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--green); }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
    .card-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .card-meta { font-size: 11px; color: var(--muted); }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .state-chip { font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .4px; }
    .state-locked { background: rgba(239,68,68,.15); color: var(--red); border: 1px solid var(--red); }
    .state-running { background: rgba(245,152,66,.15); color: var(--orange); border: 1px solid var(--orange); }
    .state-final { background: rgba(34,197,94,.15); color: var(--green); border: 1px solid var(--green); }
    .countdown { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 4px 0 6px; }
    .countdown.warn { color: var(--orange); }
    .countdown.danger { color: var(--red); }
    .result { font-size: 24px; font-weight: 700; margin: 4px 0 2px; }
    .result-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
    .dice { font-size: 22px; }
    .digits { font-family: 'Courier New', monospace; font-size: 20px; letter-spacing: 2px; }
    .color-tag { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11px; font-weight: 700; }
    .color-Red { background: rgba(239,68,66,.18); color: var(--red); }
    .color-Green { background: rgba(34,197,94,.18); color: var(--green); }
    .color-Violet { background: rgba(168,92,247,.2); color: var(--violet); }
    .history { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .history chip { font-size: 11px; background: var(--panel2); border-radius: 5px; padding: 2px 7px; }
    .bigsmall { font-size: 11px; font-weight: 600; }
    .big { color: var(--orange); }
    .small { color: var(--accent); }
    .notice { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .token-box { background: var(--panel); border: 1px dashed var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
    .token-box input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px; font-size: 13px; }
    .btn { background: var(--accent); color: #fff; border: none; border-radius: 9px; padding: 9px 15px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    footer { text-align: center; color: var(--muted); font-size: 11px; padding: 14px; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
    .dot.live { background: var(--green); }
    .dot.off { background: var(--muted); }
    @media (max-width: 540px) { header h1 { font-size: 20px; } }
  </style>
</head>
<body>
  <div id="app" class="container"></div>

  <script>
    "use strict";
    (function () {
      const PREDICTIONS_URL = '/api/predictions';
      const DEFAULT_REFRESH = 3000;
      const LOCKED_REFRESH = 5000;

      // ---- Token resolution ----
      // 1) ?token=<jwt>  2) same-origin localStorage 'token'  3) manual paste.
      function qParam(name) {
        try { return new URLSearchParams(location.search).get(name) || ''; } catch { return ''; }
      }
      function looksLikeJwt(t) {
        return typeof t === 'string' && t.split('.').length === 3 && t.length > 40;
      }
      function localToken() {
        // Only readable when this app shares its origin with the platform.
        if (!location.origin.startsWith('http')) return null;
        for (const k of ['token', 'userToken', 'accessToken']) {
          try { const v = localStorage.getItem(k); if (looksLikeJwt(v)) return v; } catch (e) {}
        }
        return null;
      }

      function getToken() {
        const t = qParam('token') || qParam('auth_token') || localToken() || localStorage.getItem('dmwin_predictor_token') || '';
        try { if (t) localStorage.setItem('dmwin_predictor_token', t); } catch { }
        return t;
      }
      function setToken(t) { try { localStorage.setItem('dmwin_predictor_token', t); } catch {} window.location.search = '?token=' + encodeURIComponent(t.trim()); }

      function authHeaders(token) {
        return token ? { Authorization: 'Bearer ' + token } : {};
      }

      function fmt(n) {
        const v = Number(n);
        if (!isFinite(v)) return String(n);
        return v >= 1000 ? v.toLocaleString('en-IN') : v.toFixed(2).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
      }

      function colorClass(c) {
        if (!c) return '';
        const s = String(c);
        if (s.includes('Red') && !s.includes('Violet')) return 'color-Red';
        if (s.includes('Green') && !s.includes('Violet')) return 'color-Green';
        return 'color-Violet';
      }

      // ---- DOM helpers ----
      function el(tag, cls, html) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html !== undefined) e.innerHTML = html;
        return e;
      }

      function countdownSec(s) {
        return Math.max(0, Math.ceil(Number(s) || 0));
      }

      // ---- Card rendering ----
      function renderCard(game) {
        const g = game;
        const card = el('div', `card ${g.locked ? 'locked' : (Number(g.secondsLeft) > 0 ? 'running' : 'final')}`);

        const head = el('div', 'card-head');
        const left = el('div');
        left.appendChild(el('div', 'card-title', g.name || g.key));
        const meta = el('div', 'card-meta');
        meta.textContent = (g.category ? g.category + ' • ' : '') + (g.intervalLabel || (g.intervalSec ? g.intervalSec + 's' : ''));
        left.appendChild(meta);
        head.appendChild(left);

        const right = el('div', 'row-between');
        // short key label e.g. WIN GO 2
        const short = (g.categoryKey || '').toUpperCase();
        const badge = el('span', 'badge', short);
        right.appendChild(badge);

        const stLabel = g.locked ? 'LOCKED' : (Number(g.secondsLeft) > 0 ? 'RUNNING' : 'FINAL');
        const stClass = g.locked ? 'state-locked' : (Number(g.secondsLeft) > 0 ? 'state-running' : 'state-final');
        right.appendChild(el('span', `state-chip ${stClass}`, stLabel));
        head.appendChild(right);
        card.appendChild(head);

        if (g.type === 'aviator_crash') {
          const mult = Number((g.details && g.details.targetCrashMultiplier) || g.declaredResult);
          const cd = countdownSec(g.secondsLeft);
          const cdEl = el('div', 'countdown', String(cd));
          if (cd <= 3) cdEl.classList.add('danger');
          else if (cd <= 6) cdEl.classList.add('warn');
          card.appendChild(cdEl);
          card.appendChild(el('div', 'result', (isFinite(mult) ? mult.toFixed(2) : g.declaredResult) + 'x CRASH'));
          const sub = el('div', 'result-row');
          sub.textContent = 'Target multiplier for this round';
          card.appendChild(sub);
          const hist = el('div', 'history');
          hist.style.marginTop = '8px';
          (g.details && Array.isArray(g.details.recentHistory) || []).slice(0, 5).forEach(h => {
            hist.appendChild(el('chip', '', h));
          });
          card.appendChild(hist);
        } else if (g.type === 'lottery_number' || g.type === 'trx_digit') {
          const cd = countdownSec(g.secondsLeft);
          const cdEl = el('div', 'countdown', String(cd));
          if (cd <= 3) cdEl.classList.add('danger');
          else if (cd <= 6) cdEl.classList.add('warn');
          card.appendChild(cdEl);
          const d = g.details || {};
          const row = el('div', 'result-row');
          const numSpan = el('span', 'result', String(d.number != null ? d.number : g.declaredResult));
          if (d.number != null) {
            row.appendChild(el('span', '', 'Number'));
            row.appendChild(numSpan);
          }
          card.appendChild(row);
          if (d.colour) {
            const c = el('div', 'result-row');
            c.appendChild(el('span', '', 'Color'));
            c.appendChild(el('span', `color-tag ${colorClass(d.colour)}`, d.colour));
            card.appendChild(c);
          }
          if (d.bs) {
            const b = el('div', 'result-row');
            b.appendChild(el('span', '', 'Size'));
            b.appendChild(el('span', `bigsmall ${d.bs === 'Big' ? 'big' : 'small'}`, d.bs));
            card.appendChild(b);
          }
        } else if (g.type === 'k3_dice') {
          const cd = countdownSec(g.secondsLeft);
          const cdEl = el('div', 'countdown', String(cd));
          if (cd <= 3) cdEl.classList.add('danger');
          else if (cd <= 6) cdEl.classList.add('warn');
          card.appendChild(cdEl);
          const d = g.details || {};
          card.appendChild(el('div', 'result', d.diceIcons || g.declaredResult));
          const b = el('div', 'result-row');
          b.appendChild(el('span', '', 'Sum'));
          b.appendChild(el('span', '', (d.sum != null ? d.sum : '') + (d.bs ? ' - ' + d.bs : '')));
          card.appendChild(b);
          if (d.isTriple) { card.appendChild(el('div', 'result-row', '🔥 Triple!')); }
        } else if (g.type === '5d_digits') {
          const cd = countdownSec(g.secondsLeft);
          const cdEl = el('div', 'countdown', String(cd));
          if (cd <= 3) cdEl.classList.add('danger');
          else if (cd <= 6) cdEl.classList.add('warn');
          card.appendChild(cdEl);
          const d = g.details || {};
          card.appendChild(el('div', 'digits', d.digits ? '[' + d.digits.join(' ') + ']' : g.declaredResult));
          const s = el('div', 'result-row');
          s.appendChild(el('span', '', 'Sum'));
          s.appendChild(el('span', '', d.sum != null ? d.sum : ''));
          card.appendChild(s);
        } else {
          // unknown type: just show the declared result + countdown.
          card.appendChild(el('div', 'countdown', String(countdownSec(g.secondsLeft))));
          card.appendChild(el('div', 'result', g.declaredResult));
        }

        // issue label
        card.appendChild(el('div', 'result-row', 'Issue ' + (g.issueNumber || '—')));
        return card;
      }

      // ---- App ----
      const app = document.getElementById('app');
      let state = { categories: [], games: {}, grouped: {}, interval: 'all', category: 'all', token: '', loadedAt: 0, timer: 0 };
      let tickTimer = null;

      function mount() {
        // header
        const h = el('header');
        h.appendChild(el('h1', '', 'DM WIN Predictor'));
        const sub = el('div', 'sub');
        sub.innerHTML = '<span class="dot off"></span> Real-time predictions • Win Go · K3 · 5D · TRX · Aviator';
        h.appendChild(sub);
        app.appendChild(h);
        app.appendChild(el('div', 'notice', '<b>How it works</b>: selects show your active interval; the result shown is the server-declared result for the upcoming round. Countdown is live.'));
        mountControls();
        app.appendChild(el('div', 'grid', ''));
        app.appendChild(el('footer', '', 'DM WIN Predictor — offline-ready PWA'));
      }

      const controls = () => app.querySelector('.grid') ? app.querySelector('.grid') : null;

      function mountControls() {
        const wrap = el('div');
        app.appendChild(wrap);
        // categories
        const tabWrap = el('div', 'tabs');
        const cats = [{ key: 'all', name: 'All' }, { key: 'wingo', name: 'Win Go' }, { key: 'k3', name: 'K3 Lotre' }, { key: '5d', name: '5D Lotre' }, { key: 'trx_wingo', name: 'TRX Win Go' }, { key: 'aviator', name: 'Aviator Crash' }];
        cats.forEach(c => {
          const t = el('span', `tab ${state.category === c.key ? 'active' : ''}`, c.name);
          t.onclick = () => { state.category = c.key; refreshTabs(); render(); };
          tabWrap.appendChild(t);
        });
        wrap.appendChild(tabWrap);
        const intervalWrap = el('div', 'intervals');
        const intervals = [{ key: 'all', name: 'All intervals' }, { key: 30, name: '30s' }, { key: 1, name: '1 Min' }, { key: 3, name: '3 Min' }, { key: 5, name: '5 Min' }, { key: 10, name: '10 Min' }];
        intervals.forEach(iv => {
          const b = el('button', `interval ${state.interval === iv.key ? 'active' : ''}`, iv.name);
          b.onclick = () => { state.interval = iv.key; refreshIntervals(); render(); };
          intervalWrap.appendChild(b);
        });
        wrap.appendChild(intervalWrap);
      }

      function refreshTabs() {
        app.querySelectorAll('.tab').forEach((t, i) => {
          const key = ['all','wingo','k3','5d','trx_wingo','aviator'][i];
          t.classList.toggle('active', state.category === key);
        });
      }
      function refreshIntervals() {
        app.querySelectorAll('.interval').forEach((b, i) => {
          const key = ['all',30,1,3,5,10][i];
          b.classList.toggle('active', state.interval === key);
        });
      }

      function intervalMatches(g) {
        if (state.interval === 'all') return true;
        if (state.category === 'aviator') return true; // single
        // map intervalSec -> our selection keys
        const m = { 30: 30, 60: 1, 180: 3, 300: 5, 600: 10 };
        return m[g.intervalSec] === state.interval;
      }
      function categoryMatches(g) {
        if (state.category === 'all') return true;
        if (g.categoryKey === state.category) return true;
        // legacy aliases used by the server
        if (state.category === 'all') return true;
        if (g.key === state.category) return true;
        return false;
      }

      function visibleGames() {
        return Object.values(state.games).filter(g => categoryMatches(g) && intervalMatches(g));
      }

      function setCountdown() {
        const now = Date.now();
        state.timer = Math.floor((now - state.loadedAt) / 1000);
        const cds = app.querySelectorAll('.countdown');
        if (cds.length === 0) return;
        let min = Infinity;
        cds.forEach(c => {
          // recompute from the card's game secondsLeft stored in dataset? Simpler: we don't have per-card data here.
        });
        // We re-render countdown each second from stored secondsLeft.
      }

      function tick() {
        const cds = app.querySelectorAll('.countdown');
        if (cds.length === 0) return;
        // Use each card's remaining via dataset
        cds.forEach(c => {
          const left = Number(c.dataset.left) || 0;
          c.dataset.left = left;
          let v = left;
          if (v <= 0) { c.textContent = '0'; return; }
          c.textContent = String(v);
          c.classList.toggle('danger', v <= 3);
          c.classList.toggle('warn', v > 3 && v <= 6);
          c.dataset.left = (left - 1);
        });
        // schedule next tick
        tickScheduled = setTimeout(tick, 1000);
      }

      let tickScheduled = null;
      function startTick() {
        if (tickScheduled) return;
        // seed dataset.left from current text
        app.querySelectorAll('.countdown').forEach(c => { c.dataset.left = c.textContent || 0; });
        tick();
      }

      function render() {
        const grid = app.querySelector('.grid');
        if (!grid) return;
        grid.innerHTML = '';
        const list = visibleGames();
        if (!list.length) { grid.innerHTML = '<div class="notice">No games match your filters.</div>'; return; }
        // order: category order
        list.forEach(g => grid.appendChild(renderCard(g)));
        startTick();
      }

      function showTokenPrompt(msg) {
        const grid = app.querySelector('.grid');
        grid.innerHTML = '';
        const box = el('div', 'token-box');
        box.innerHTML = '<input id="tok" type="text" placeholder="Paste your DM WIN session token (JWT)…" autocomplete="off" />';
        const actions = el('div', 'row-between');
        actions.style.marginTop = '10px';
        actions.appendChild(el('button', 'btn ghost', 'Use this device login'));
        const go = el('button', 'btn', 'Load token');
        go.onclick = () => {
          const v = document.getElementById('tok').value.trim();
          if (looksLikeJwt(v)) setToken(v); else alert('Invalid token');
        };
        actions.appendChild(go);
        box.appendChild(actions);
        const notice = el('div', 'notice', msg || 'A valid session token is required to read your predictions.');
        app.insertBefore(notice, grid);
        app.insertBefore(box, grid);
        // "Use this device login" -> attempt reading platform localStorage (same origin)
        const btns = box.querySelectorAll('button');
        btns[0].onclick = () => {
          const t = localToken();
          if (t) { window.location.search = '?token=' + encodeURIComponent(t); } else { alert('No session found on this device. Paste your JWT token below.'); }
        };
      }

      let abort = false;
      async function loadData() {
        const token = getToken();
        state.token = token;
        if (!token) { showTokenPrompt('Paste your DM WIN session token (JWT) in the box below — the link you received already has it.'); return; }
        const res = await fetch(PREDICTIONS_URL + (PREDICTIONS_URL.includes('?') ? '&' : '?') + 'ts=' + Date.now(), {
          headers: { Authorization: 'Bearer ' + token }
        }).catch(() => null);
        if (!res) { showTokenPrompt('Could not reach the prediction server. Check your connection and try again.'); return; }
        const j = await res.json();
        if (res.status === 401) { showTokenPrompt('Your session token is invalid or expired. Sign in again on the main app, then reopen this link.'); return; }
        if (!j || j.code !== 0 || !j.data) { showTokenPrompt('Predictions unavailable: ' + (j && j.msg ? j.msg : 'server error')); return; }
        state.categories = j.data.categories || [];
        state.grouped = j.data.grouped || {};
        // Keep only real game entries. The unified payload also ships a
        // per-category summary keyed by the bare category name (wingo, k3, 5d,
        // trx_wingo) — render only interval-bearing games + aviator to avoid
        // duplicate cards.
        state.games = {};
        Object.entries(j.data.games || {}).forEach(function (kv) {
          var k = kv[0];
          if (k.indexOf('_') !== -1 || k === 'aviator') state.games[k] = kv[1];
        });
        state.loadedAt = Date.now();
        // hide token prompt if present
        app.querySelectorAll('.token-box').forEach(n => n.remove());
        app.querySelectorAll('.notice')[0] && (app.querySelectorAll('.notice')[0].remove());
        render();
        scheduleNext();
      }

      let schedule = null;
      function scheduleNext() {
        const anyLocked = Object.values(state.games).some(g => g.locked);
        clearTimeout(schedule);
        schedule = setTimeout(() => { if (!abort) loadData(); }, anyLocked ? LOCKED_REFRESH : DEFAULT_REFRESH);
      }

      function go() {
        mount();
        loadData();
      }

      // expose for debugging
      window.__dmwin = { loadData, getToken, state: () => state };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
      else go();
    })();
  </script>
</body>
</html>
