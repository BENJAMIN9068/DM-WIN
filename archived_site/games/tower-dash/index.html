<!DOCTYPE html>
<html lang="en-us">

<script id="__wallet_bridge__">
(function() {
  var WALLET_KEY = 'dmfirst_game_wallet';
  var SLUG = 'tower-dash';

  // The authoritative balance is held here, not in window.__gameBalance, so a
  // game writing its own placeholder can never be mistaken for the truth.
  var serverBalance = null;
  var booted = false;

  function readToken() {
    try {
      var t = localStorage.getItem('token') || localStorage.getItem('userToken') ||
              localStorage.getItem('accessToken');
      if (t) return t;
      // The platform appends its session token to the game URL.
      var q = new URLSearchParams(location.search);
      return q.get('token') || q.get('auth_token') || q.get('authToken') || '';
    } catch (e) { return ''; }
  }

  function readCache() {
    try {
      var d = JSON.parse(localStorage.getItem(WALLET_KEY) || 'null');
      if (d && typeof d.balance === 'number' && d.balance >= 0) return d.balance;
    } catch (e) {}
    return null;
  }

  function writeCache(bal) {
    try {
      var existing = {};
      try { existing = JSON.parse(localStorage.getItem(WALLET_KEY) || '{}'); } catch (e) {}
      existing.balance = bal;
      existing.time = Date.now();
      localStorage.setItem(WALLET_KEY, JSON.stringify(existing));
    } catch (e) {}
  }

  function walletUrl() {
    var t = readToken();
    return '/api/game-wallet' + (t ? '?token=' + encodeURIComponent(t) : '');
  }

  function xhr(method, url, body, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open(method, url, true);
      x.timeout = 8000;
      var t = readToken();
      if (t) { try { x.setRequestHeader('Authorization', 'Bearer ' + t); } catch (e) {} }
      if (body) x.setRequestHeader('Content-Type', 'application/json');
      x.onreadystatechange = function() {
        if (x.readyState !== 4) return;
        var data = null;
        try { data = JSON.parse(x.responseText); } catch (e) {}
        cb(data, x.status);
      };
      x.onerror = function() { cb(null, 0); };
      x.ontimeout = function() { cb(null, 0); };
      x.send(body ? JSON.stringify(body) : undefined);
    } catch (e) { cb(null, 0); }
  }

  // Keeps the in-game balance chip in sync for the games that render their own
  // DOM element instead of reading window.__gameBalance.
  function paint() {
    try {
      var el = document.querySelector('[data-testid="menu-balance"]');
      if (!el) return;
      var bal = serverBalance === null ? readCache() : serverBalance;
      if (bal === null || bal === undefined) return;
      if (el.__lastBal === bal) return;
      el.__lastBal = bal;
      var formatted = Number(bal).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      var sprite = '/games/' + SLUG + '/static/svg/sprite.4de80bac.svg#INR';
      el.innerHTML = formatted + '<svg width="18" height="18" viewBox="0 0 18 18" style="fill: rgb(255, 255, 255); margin-left: 4px;"><use xlink:href="' + sprite + '"></use></svg>';
    } catch (e) {}
  }

  // window.__gameBalance is the contract the game bundles read (and write) for
  // the wallet. Route it through the authoritative value once it is known.
  var shadow = readCache();
  if (shadow === null) shadow = 0;
  try {
    Object.defineProperty(window, '__gameBalance', {
      configurable: true,
      get: function() { return serverBalance === null ? shadow : serverBalance; },
      set: function(v) {
        var n = Number(v);
        if (!isFinite(n)) return;
        if (serverBalance === null) { shadow = n; paint(); return; }
        // The game changed the balance itself: forward only the difference.
        var delta = n - serverBalance;
        serverBalance = n;
        writeCache(n);
        if (delta !== 0) reportDelta(delta);
        paint();
      }
    });
  } catch (e) {
    window.__gameBalance = shadow;
  }

  // Reports how the balance moved. Only ever called with a real delta measured
  // against a loaded server balance, so it cannot push a placeholder.
  var reportQueue = [];
  var reporting = false;
  function reportDelta(delta) {
    if (!booted || !delta || !isFinite(delta)) return;
    reportQueue.push(delta);
    if (reporting) return;
    reporting = true;
    return flushReports();
  }

  function flushReports() {
    var total = reportQueue.reduce(function(a, b) { return a + b; }, 0);
    reportQueue = [];
    if (!total) { reporting = false; return; }
    var target = Math.max(0, serverBalance);
    xhr('POST', walletUrl(), { balance: target, slug: SLUG, delta: total }, function() {
      if (reportQueue.length) return flushReports();
      reporting = false;
    });
  }

  function loadFromServer() {
    var cached = readCache();
    if (cached !== null) shadow = cached;
    xhr('GET', walletUrl(), null, function(data) {
      if (data && typeof data.balance === 'number' && isFinite(data.balance)) {
        serverBalance = data.balance;
        shadow = data.balance;
        booted = true;           // only now may anything be written back
        writeCache(data.balance);
        paint();
        try {
          window.dispatchEvent(new CustomEvent('dmfirst:balance', { detail: { balance: serverBalance, slug: SLUG } }));
        } catch (e) {}
      }
    });
  }

  loadFromServer();
  setInterval(paint, 300);
  document.addEventListener('DOMContentLoaded', paint);

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) return;
    // Refresh from the server; never write while the tab is going away.
    loadFromServer();
  });

  window.__dmWallet = {
    url: walletUrl,
    get: function() { return serverBalance === null ? shadow : serverBalance; },
    isLoaded: function() { return serverBalance !== null; },
    set: function(v) { try { window.__gameBalance = v; } catch (e) {} },
    reload: loadFromServer
  };

  window.__gameWalletBridge = {
    slug: SLUG,
    balance: function() { return serverBalance === null ? shadow : serverBalance; },
    loaded: function() { return serverBalance !== null; },
    // The server-side balance as the game is allowed to see it.
    refresh: loadFromServer
  };
})();
</script>

        try {
          window.alert = function(msg) { console.warn('[Suppressed alert]:', msg); };

          window.prompt = function() { return null; };
          Object.defineProperty(window, 'alert', { value: window.alert, writable: false, configurable: true });
          Object.defineProperty(window, 'confirm', { value: window.confirm, writable: false, configurable: true });
          Object.defineProperty(window, 'prompt', { value: window.prompt, writable: false, configurable: true });
        } catch(e) {}

        var defaults = {
          gameMode: 'megablock',
          operatorId: 'ee2013ed-e1f0-4d6e-97d2-f36619e2eb52',
          authToken: '247d3637-c5dc-a67b-50a1-89df27733343',

        };

        try {
          var fullParams = '?gameMode=megablock&operatorId=ee2013ed-e1f0-4d6e-97d2-f36619e2eb52&authToken=247d3637-c5dc-a67b-50a1-89df27733343&currency=INR&lang=en&_enableCanvasTestGrid=1&theme=&lobbyUrl=';
          if (!window.location.search || !window.location.search.includes('operatorId')) {
            window.history.replaceState(null, '', window.location.pathname + fullParams);
          }
        } catch(e) {}

        try {
          var origGet = URLSearchParams.prototype.get;
          URLSearchParams.prototype.get = function(name) {
            var val = origGet.call(this, name);
            if (name === "currency") return "INR";
            if (!val && defaults[name]) {
              return defaults[name];
            }
            return val;
          };
        } catch(e) {}

<script id="__clean_fun_mode_js__">
(function() {
  function removeFunDemoText() {
    try {
      var root = document.body || document.documentElement;
      if (!root) return;
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
      var node;
      while ((node = walker.nextNode())) {
        if (node.nodeValue && /(fun\s*mode|demo\s*mode|play\s*for\s*fun)/i.test(node.nodeValue)) {
          node.nodeValue = node.nodeValue.replace(/(fun\s*mode|demo\s*mode|play\s*for\s*fun)/gi, '');
        }
      }
    } catch(e) {}
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      removeFunDemoText();
      setInterval(removeFunDemoText, 1000);
    });
  } else {
    removeFunDemoText();
    setInterval(removeFunDemoText, 1000);
  }
})();
</script>

    <!--
      Слои-порталы для модалок. Лежат прямо в <body> (не внутри #fit-root),
      чтобы выйти из stacking-контекстов #fit-root (transform) и ThemeBackground
      (transform) — иначе системные модалки оказываются «заперты» под игровыми.
      Порядок задаётся ИМЕННО здесь, один раз: игровые (spine win-модалки) ниже,
      системные (info-модалки) выше. Внутри каждого слоя z-index локален.
      TransitionScreen намеренно НЕ тут — у него свой полноэкранный портал с
      максимальным z-index, он перекрывает вообще всё.
    -->

    <script>
      (function () {
        // Global anti-zoom guard for mobile browsers (pinch, double-tap, gesture zoom).
        function blockZoomGesture(event) {
          if (event.cancelable) {
            event.preventDefault();
          }
        }

        function isInteractiveTouchTarget(target) {
          if (!target || !(target instanceof Element)) return false;
          return Boolean(
            target.closest("input, textarea, select, button, a, label, canvas, [role='button'], [contenteditable='true']"),
          );
        }

        document.addEventListener("gesturestart", blockZoomGesture, { passive: false });
        document.addEventListener("gesturechange", blockZoomGesture, { passive: false });
        document.addEventListener("gestureend", blockZoomGesture, { passive: false });

        // Disable long-press context menu / text selection magnifier on any
        // non-editable element. We keep it enabled for inputs/textareas so
        // the user can still reach the keyboard's own cursor UI.
        document.addEventListener("contextmenu", function (event) {
          var target = event.target;
          if (isInteractiveTouchTarget(target) && target instanceof HTMLElement) {
            var tag = target.tagName;
            if (tag === "INPUT" || tag === "TEXTAREA" || target.isContentEditable) {
              return;
            }
          }
          if (event.cancelable) {
            event.preventDefault();
          }
        }, { passive: false });

        document.addEventListener("touchstart", function (event) {
          if (event.touches && event.touches.length > 1) {
            blockZoomGesture(event);
          }
        }, { passive: false });

        document.addEventListener("touchmove", function (event) {
          if (event.touches && event.touches.length > 1) {
            blockZoomGesture(event);
          }
        }, { passive: false });

        var lastSingleTouchEnd = 0;
        document.addEventListener("touchend", function (event) {
          var now = Date.now();
          if (now - lastSingleTouchEnd <= 300 && !isInteractiveTouchTarget(event.target)) {
            blockZoomGesture(event);
          }
          lastSingleTouchEnd = now;
        }, { passive: false });

        window.addEventListener("wheel", function (event) {
          if (event.ctrlKey) {
            blockZoomGesture(event);
          }
        }, { passive: false });

        function keepWindowAtTop() {
          if (window.scrollX !== 0 || window.scrollY !== 0) {
            window.scrollTo(0, 0);
          }
        }

        keepWindowAtTop();
        window.addEventListener("scroll", keepWindowAtTop, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("scroll", keepWindowAtTop);
        }

        function fit(container, minRatioW, minRatioH, maxRatioW, maxRatioH, viewportWidth, viewportHeight) {
          var widthBase = Math.max(1, viewportWidth || window.innerWidth);
          var heightBase = Math.max(1, viewportHeight || window.innerHeight);
          var currentR = widthBase / heightBase;

          var minR = minRatioW / minRatioH;
          var maxR = maxRatioW / maxRatioH;

          var clampedR = Math.min(Math.max(currentR, minR), maxR);

          var width = widthBase;
          var height = width / clampedR;

          if (height > heightBase) {
            width = Math.min(width, Math.ceil(heightBase * clampedR));
          }

          height = Math.floor(width / clampedR);

          container.style.width = width + "px";
          container.style.height = height + "px";

          // header/logo scale based on fitted area height
          var baseHeight = 900; // design reference height
          var headerScale = container.clientHeight / baseHeight;
          if (!isFinite(headerScale) || headerScale <= 0) headerScale = 1;
          // clamp: not larger than 100% (no minimum floor)
          headerScale = Math.min(1, headerScale);
          document.documentElement.style.setProperty("--header-scale", String(headerScale));
        }

        var stableViewportWidth = window.innerWidth;
        var stableViewportHeight = window.innerHeight;

        function isEditableElement(element) {
          if (!element || !(element instanceof HTMLElement)) return false;
          if (element.isContentEditable) return true;
          var tagName = element.tagName;
          if (tagName === "TEXTAREA") {
            return !element.readOnly && !element.disabled;
          }
          if (tagName !== "INPUT") return false;
          var inputType = (element.type || "").toLowerCase();
          if (element.readOnly || element.disabled) return false;
          if (!inputType) return true;
          return [
            "text",
            "search",
            "tel",
            "url",
            "email",
            "password",
            "number"
          ].indexOf(inputType) !== -1;
        }

        function isKeyboardLikelyOpen() {
          var active = document.activeElement;
          if (!isEditableElement(active)) return false;

          var currentHeight = window.innerHeight;
          if (stableViewportHeight - currentHeight > 90) {
            return true;
          }

          if (!window.visualViewport) {
            return false;
          }

          var vv = window.visualViewport;
          var visualGap = Math.max(0, currentHeight - vv.height - vv.offsetTop);
          return visualGap > 90;
        }

        function applyFit() {
          var container = document.getElementById("fit-root");
          if (!container) return;

          var viewportWidth = window.innerWidth;
          var viewportHeight = window.innerHeight;
          var keyboardOpen = isKeyboardLikelyOpen();

          if (keyboardOpen) {
            viewportWidth = stableViewportWidth;
            viewportHeight = stableViewportHeight;
          } else {
            stableViewportWidth = viewportWidth;
            stableViewportHeight = viewportHeight;
          }

          fit(container, 1, 2340, 2620, 1, viewportWidth, viewportHeight);
        }

        var rafId = null;
        var scheduleFit = function () {
          if (rafId !== null) {
            cancelAnimationFrame(rafId);
          }
          rafId = requestAnimationFrame(function () {
            rafId = null;
            applyFit();
          });
        };

        scheduleFit();
        window.addEventListener("load", scheduleFit);
        window.addEventListener("resize", scheduleFit);
        window.addEventListener("orientationchange", scheduleFit);
        document.addEventListener("focusin", scheduleFit, true);
        document.addEventListener("focusout", function () {
          setTimeout(scheduleFit, 60);
        }, true);

        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", scheduleFit);
        }

        if ("ResizeObserver" in window) {
          var resizeObserver = new ResizeObserver(scheduleFit);
          resizeObserver.observe(document.documentElement);
        }
      })();
    </script>
