name: Build and deploy Node.js app to Azure Web App - DM-WIN

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: DM-WIN
  NODE_VERSION: 20.19.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install production runtime dependencies
        run: npm ci --omit=dev
      - name: Verify server syntax
        run: node --check serve.mjs
      - name: Create runtime-only deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir deployment
          cp package.json package-lock.json serve.mjs admin_backend.mjs aviator_server_engine.mjs deployment/
          cp all_games_dmfirst1.json slots_with_child_dmfirst1.json video_with_child_dmfirst1.json game_categories_dmfirst1.json deployment/
          cp local_admin_audit.json local_bets.json local_games.json local_gateways.json local_hack_bots.json local_recharges.json local_users.json local_withdrawals.json deployment/
          cp -a archived_site captured_api_responses deployment/
          test -f deployment/package.json
          test -f deployment/serve.mjs
          test -d deployment/archived_site
          test ! -e deployment/node_modules
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: dm-win-runtime
          path: deployment
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: dm-win-runtime
          path: deployment
      - name: Verify deployment package root
        shell: bash
        run: |
          set -euo pipefail
          test -f deployment/package.json
          test -f deployment/serve.mjs
          test ! -e deployment/node_modules
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9BF87F0AFA06414FAB48A9585B2D54F3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_24A153C515ED4216868C08E04DA8133F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_392E6CD8DE14405C9AEFB0423CCB4775 }}
      - name: Deploy runtime artifact to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: deployment
